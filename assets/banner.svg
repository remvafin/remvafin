<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Rem Vafin, founder. Building Silkro, the trust layer for global sourcing.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13285a"/>
      <stop offset="0.55" stop-color="#0a1733"/>
      <stop offset="1" stop-color="#050c1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9d7ae"/>
      <stop offset="0.5" stop-color="#c9a35b"/>
      <stop offset="1" stop-color="#8a6a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#c9a35b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c9a35b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- silk threads: a route from Shenzhen out to the world -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M760 250 C 900 250, 960 120, 1210 70" stroke-width="2" opacity="0.9"/>
    <path d="M760 250 C 920 240, 1010 190, 1210 160" stroke-width="1.4" opacity="0.6"/>
    <path d="M760 250 C 930 262, 1040 260, 1210 250" stroke-width="1" opacity="0.4"/>
  </g>
  <g fill="#e9d7ae">
    <circle cx="760" cy="250" r="6"/>
    <circle cx="1210" cy="70" r="4"/>
    <circle cx="1210" cy="160" r="3.5" opacity="0.8"/>
    <circle cx="1210" cy="250" r="3" opacity="0.6"/>
  </g>
  <text x="760" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#7e8ba8">SHENZHEN</text>

  <!-- text -->
  <text x="72" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3" fill="#c9a35b">FOUNDER · SHENZHEN · FROM UZBEKISTAN</text>
  <text x="68" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#f7f5f0">Rem Vafin</text>
  <text x="72" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#b8c2d9">Building <tspan fill="#e9d7ae">Silkro</tspan>, the trust layer for global sourcing.</text>
  <text x="72" y="258" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#7e8ba8">Before: TradeMind, AI market analysis for 350+ traders in 19+ countries.</text>
</svg>
